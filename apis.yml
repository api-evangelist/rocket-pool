  description: >-
    The rocketpool-js library is a TypeScript/JavaScript client for the Rocket Pool protocol's deployed
    smart contracts. It mirrors much of the Go library's surface and is intended for browser-based dApps,
    indexer services, and integrations such as DeFi front-ends that need to read rETH state or submit
    user deposits.
