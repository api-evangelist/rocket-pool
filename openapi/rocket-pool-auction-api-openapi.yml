openapi: 3.2.0
info:
  title: Rocket Pool Auction API
  version: '1.0'
  description: 'Operations tagged Auction across 2 of this provider''s published API definitions: rocket-pool-protocol-openapi.yml, rocket-pool-smart-node-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://protocol.rocketpool.example/v1
  description: Logical base path — actual access is via Ethereum smart contracts
- url: http://localhost:8080/api
  description: Local Smart Node daemon (loopback)
tags:
- name: Auction
paths:
  /auction/lots:
    get:
      tags:
      - Auction
      summary: List Auction Lots
      operationId: listAuctionLotsProtocol
      responses:
        '200':
          description: All auction lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionLot'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /auction/status:
    get:
      tags:
      - Auction
      summary: Get RPL Auction Status
      operationId: getAuctionStatus
      responses:
        '200':
          description: Auction status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionStatus'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /auction/bid-lot:
    post:
      tags:
      - Auction
      summary: Bid On Auction Lot
      operationId: bidAuctionLot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionBidRequest'
      responses:
        '200':
          description: Bid submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
components:
  schemas:
    EthAmount:
      type: string
      description: Amount in wei
    AuctionLot:
      type: object
      properties:
        index:
          type: integer
        startBlock:
          type: integer
        endBlock:
          type: integer
        currentPrice:
          $ref: '#/components/schemas/EthAmount'
        totalRplAmount:
          $ref: '#/components/schemas/EthAmount'
    EthAmount_2:
      type: string
      description: Amount expressed in wei (1 ETH = 10^18 wei)
      example: '32000000000000000000'
    AuctionLot_2:
      type: object
      properties:
        index:
          type: integer
        exists:
          type: boolean
        startBlock:
          type: integer
        endBlock:
          type: integer
        startPrice:
          $ref: '#/components/schemas/EthAmount_2'
        currentPrice:
          $ref: '#/components/schemas/EthAmount_2'
        totalRplAmount:
          $ref: '#/components/schemas/EthAmount_2'
        claimedRplAmount:
          $ref: '#/components/schemas/EthAmount_2'
        remainingRplAmount:
          $ref: '#/components/schemas/EthAmount_2'
    AuctionBidRequest:
      type: object
      required:
      - lotIndex
      - amount
      properties:
        lotIndex:
          type: integer
        amount:
          $ref: '#/components/schemas/EthAmount_2'
    TransactionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
        txHash:
          $ref: '#/components/schemas/TransactionHash'
        gasInfo:
          type: object
          properties:
            estGasLimit:
              type: integer
            safeGasLimit:
              type: integer
        error:
          type: string
    TransactionHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
    AuctionStatus:
      type: object
      properties:
        lotCount:
          type: integer
        remainingRpl:
          $ref: '#/components/schemas/EthAmount_2'
        canCreateLot:
          type: boolean
x-refined-from:
- rocket-pool-protocol-openapi.yml
- rocket-pool-smart-node-openapi.yml
