openapi: 3.2.0
info:
  title: Rocket Pool Minipool API
  version: '1.0'
  description: 'Operations tagged Minipool across 2 of this provider''s published API definitions: rocket-pool-protocol-openapi.yml, rocket-pool-smart-node-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://protocol.rocketpool.example/v1
  description: Logical base path — actual access is via Ethereum smart contracts
- url: http://localhost:8080/api
  description: Local Smart Node daemon (loopback)
tags:
- name: Minipool
paths:
  /minipools:
    get:
      tags:
      - Minipool
      summary: List Minipools
      operationId: listMinipoolsProtocol
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 1000
      responses:
        '200':
          description: Page of minipools
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MinipoolDetails'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /minipools/{address}:
    get:
      tags:
      - Minipool
      summary: Get Minipool Details
      operationId: getMinipool
      parameters:
      - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Minipool details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinipoolDetails'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /minipool/status:
    get:
      tags:
      - Minipool
      summary: List Node Minipools
      operationId: listMinipools
      responses:
        '200':
          description: List of minipools belonging to the node
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Minipool'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /minipool/{address}/stake:
    post:
      tags:
      - Minipool
      summary: Stake Minipool After Scrub Check
      operationId: stakeMinipool
      parameters:
      - $ref: '#/components/parameters/MinipoolAddress'
      responses:
        '200':
          description: Stake submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /minipool/{address}/exit:
    post:
      tags:
      - Minipool
      summary: Exit Minipool From Beacon Chain
      operationId: exitMinipool
      parameters:
      - $ref: '#/components/parameters/MinipoolAddress'
      responses:
        '200':
          description: Exit signed and broadcast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /minipool/{address}/close:
    post:
      tags:
      - Minipool
      summary: Close Minipool
      operationId: closeMinipool
      parameters:
      - $ref: '#/components/parameters/MinipoolAddress'
      responses:
        '200':
          description: Close submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /minipool/{address}/distribute-balance:
    post:
      tags:
      - Minipool
      summary: Distribute Minipool Balance
      operationId: distributeMinipoolBalance
      parameters:
      - $ref: '#/components/parameters/MinipoolAddress'
      responses:
        '200':
          description: Distribute submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
components:
  schemas:
    Address:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
    EthAmount:
      type: string
      description: Amount in wei
    MinipoolDetails:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        nodeAddress:
          $ref: '#/components/schemas/Address'
        validatorPubkey:
          $ref: '#/components/schemas/PublicKey'
        status:
          type: string
        depositType:
          type: string
        nodeDepositBalance:
          $ref: '#/components/schemas/EthAmount'
        userDepositBalance:
          $ref: '#/components/schemas/EthAmount'
        nodeFee:
          type: number
          format: float
        delegateAddress:
          $ref: '#/components/schemas/Address'
        useLatestDelegate:
          type: boolean
        finalised:
          type: boolean
    PublicKey:
      type: string
      pattern: ^0x[a-fA-F0-9]{96}$
    Address_2:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0x0000000000000000000000000000000000000000'
    EthAmount_2:
      type: string
      description: Amount expressed in wei (1 ETH = 10^18 wei)
      example: '32000000000000000000'
    TransactionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
        txHash:
          $ref: '#/components/schemas/TransactionHash'
        gasInfo:
          type: object
          properties:
            estGasLimit:
              type: integer
            safeGasLimit:
              type: integer
        error:
          type: string
    TransactionHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$
    PublicKey_2:
      type: string
      pattern: ^0x[a-fA-F0-9]{96}$
      description: BLS12-381 validator public key
    Minipool:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address_2'
        validatorPubkey:
          $ref: '#/components/schemas/PublicKey_2'
        status:
          type: string
          enum:
          - Initialized
          - Prelaunch
          - Staking
          - Withdrawable
          - Dissolved
        depositType:
          type: string
          enum:
          - None
          - Full
          - Half
          - Empty
          - Variable
        nodeDepositBalance:
          $ref: '#/components/schemas/EthAmount_2'
        userDepositBalance:
          $ref: '#/components/schemas/EthAmount_2'
        nodeFee:
          type: number
          format: float
          description: Node commission rate (0..1)
        createdTime:
          type: string
          format: date-time
        useLatestDelegate:
          type: boolean
  parameters:
    Address:
      name: address
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Address'
    MinipoolAddress:
      name: address
      in: path
      required: true
      description: The Ethereum address of the minipool contract
      schema:
        $ref: '#/components/schemas/Address_2'
x-refined-from:
- rocket-pool-protocol-openapi.yml
- rocket-pool-smart-node-openapi.yml
