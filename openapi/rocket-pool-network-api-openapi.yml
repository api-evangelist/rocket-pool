openapi: 3.2.0
info:
  title: Rocket Pool Network API
  version: '1.0'
  description: 'Operations tagged Network across 2 of this provider''s published API definitions: rocket-pool-protocol-openapi.yml, rocket-pool-smart-node-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://protocol.rocketpool.example/v1
  description: Logical base path — actual access is via Ethereum smart contracts
- url: http://localhost:8080/api
  description: Local Smart Node daemon (loopback)
tags:
- name: Network
paths:
  /network/balances:
    get:
      tags:
      - Network
      summary: Get Latest Reported Network Balances
      operationId: getNetworkBalances
      responses:
        '200':
          description: Reported balances and rETH backing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkBalances'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /network/fees:
    get:
      tags:
      - Network
      summary: Get Network Fee Configuration
      operationId: getNetworkFees
      responses:
        '200':
          description: Current node commission curve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkFees'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /network/prices:
    get:
      tags:
      - Network
      summary: Get Latest Reported RPL Price
      operationId: getNetworkPrices
      responses:
        '200':
          description: Reported RPL price and supply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPrices'
    servers:
    - url: https://protocol.rocketpool.example/v1
      description: Logical base path — actual access is via Ethereum smart contracts
  /network/stats:
    get:
      tags:
      - Network
      summary: Get Network Stats
      operationId: getNetworkStats
      responses:
        '200':
          description: Network statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkStats'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /network/node-fee:
    get:
      tags:
      - Network
      summary: Get Current Node Commission Rate
      operationId: getNetworkNodeFee
      responses:
        '200':
          description: Current node fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeFee'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /network/rpl-price:
    get:
      tags:
      - Network
      summary: Get Current RPL Price In ETH
      operationId: getRplPrice
      responses:
        '200':
          description: RPL price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RplPrice'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
  /network/dao-proposals:
    get:
      tags:
      - Network
      summary: Get Currently Active DAO Proposals
      operationId: getActiveDaoProposals
      responses:
        '200':
          description: Active proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaoProposal'
    servers:
    - url: http://localhost:8080/api
      description: Local Smart Node daemon (loopback)
components:
  schemas:
    EthAmount:
      type: string
      description: Amount in wei
    NetworkFees:
      type: object
      properties:
        nodeFee:
          type: number
          format: float
        minNodeFee:
          type: number
          format: float
        maxNodeFee:
          type: number
          format: float
        targetNodeFee:
          type: number
          format: float
    NetworkBalances:
      type: object
      properties:
        block:
          type: integer
        totalEth:
          $ref: '#/components/schemas/EthAmount'
        stakingEth:
          $ref: '#/components/schemas/EthAmount'
        rethSupply:
          $ref: '#/components/schemas/EthAmount'
    NetworkPrices:
      type: object
      properties:
        block:
          type: integer
        rplPrice:
          type: number
          format: double
    Address:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0x0000000000000000000000000000000000000000'
    EthAmount_2:
      type: string
      description: Amount expressed in wei (1 ETH = 10^18 wei)
      example: '32000000000000000000'
    NodeFee:
      type: object
      properties:
        nodeFee:
          type: number
          format: float
          example: 0.14
        minNodeFee:
          type: number
          format: float
        maxNodeFee:
          type: number
          format: float
        targetNodeFee:
          type: number
          format: float
    DaoProposal:
      type: object
      properties:
        id:
          type: integer
        proposer:
          $ref: '#/components/schemas/Address'
        message:
          type: string
        state:
          type: string
          enum:
          - Pending
          - ActivePhase1
          - ActivePhase2
          - Cancelled
          - Vetoed
          - QuorumNotMet
          - Defeated
          - Succeeded
          - Expired
          - Executed
        createdTime:
          type: string
          format: date-time
    RplPrice:
      type: object
      properties:
        priceEth:
          type: number
          format: double
        block:
          type: integer
        blockTime:
          type: string
          format: date-time
    NetworkStats:
      type: object
      properties:
        totalValueLocked:
          $ref: '#/components/schemas/EthAmount_2'
        rethSupply:
          $ref: '#/components/schemas/EthAmount_2'
        rethExchangeRate:
          type: number
          format: double
        rplPriceEth:
          type: number
          format: double
        totalRplStaked:
          $ref: '#/components/schemas/EthAmount_2'
        totalNodes:
          type: integer
        totalMinipools:
          type: integer
        totalMegapoolValidators:
          type: integer
x-refined-from:
- rocket-pool-protocol-openapi.yml
- rocket-pool-smart-node-openapi.yml
