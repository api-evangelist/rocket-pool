openapi: 3.2.0
info:
  title: Rocket Pool Smart Node Daemon Service API
  description: Local HTTP API exposed by the rocketpool-daemon Go service that ships with the Rocket Pool Smart Node Docker stack.
  version: 1.16.0
  license:
    name: GPL-3.0
    url: https://github.com/rocket-pool/smartnode/blob/master/LICENSE
  contact:
    name: Rocket Pool
    url: https://github.com/rocket-pool/smartnode
servers:
- url: http://localhost:8080/api
  description: Local Smart Node daemon (loopback)
tags:
- name: Service
paths:
  /service/version:
    get:
      tags:
      - Service
      summary: Get Smart Node Service Version
      operationId: getServiceVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceVersion'
  /service/status:
    get:
      tags:
      - Service
      summary: Get Smart Node Service Status
      operationId: getServiceStatus
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
components:
  schemas:
    ServiceStatus:
      type: object
      properties:
        running:
          type: boolean
        containers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              state:
                type: string
              uptimeSeconds:
                type: integer
    ServiceVersion:
      type: object
      properties:
        smartNodeVersion:
          type: string
          example: 1.16.0
        daemonVersion:
          type: string
        configVersion:
          type: string
